[build-system]
requires = [
  "cmake>=3.28",
  "scikit-build-core>=0.11,<0.12",
  "pybind11==3.0.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "vidmap-native"
dynamic = ["version"]
description = "VidMap native mapping algorithms for pristine COLMAP"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/vidmap_native"]
sdist.include = [
  ".clang-format",
  "CMakeLists.txt",
  "src/**",
  "python/**",
  "tests/**",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/vidmap_native/_version.py"
